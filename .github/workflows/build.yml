name: build

on:
  push:
    branches: [main, 'improvements/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      # Kompiliert mit -Werror, prueft Spotless und SpotBugs, fuehrt die Tests aus und baut das Jar.
      # Der Dependency-Check laeuft im eigenen Job unten.
      - name: Build
        run: ./gradlew build -x dependencyCheckAnalyze
      - name: Integration tests (Testcontainers, Docker is available on the runner)
        run: ./gradlew integrationTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            build/reports
            build/test-results
          if-no-files-found: ignore

  dependency-check:
    runs-on: ubuntu-latest
    env:
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
    steps:
      - name: Check for the NVD API key
        id: key
        run: |
          if [ -n "$NVD_API_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::NVD_API_KEY is not set as a repository secret, dependency check skipped."
          fi
      - uses: actions/checkout@v4
        if: steps.key.outputs.present == 'true'
      - uses: actions/setup-java@v4
        if: steps.key.outputs.present == 'true'
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        if: steps.key.outputs.present == 'true'
      - name: Dependency check
        if: steps.key.outputs.present == 'true'
        run: ./gradlew dependencyCheckAnalyze
