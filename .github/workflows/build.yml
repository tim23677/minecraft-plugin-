name: build

on:
  push:
    branches: [main, 'improvements/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      # Kompiliert mit -Werror, prueft Spotless und SpotBugs, fuehrt die Tests aus und baut das Jar.
      # Der Dependency-Check laeuft im eigenen Job unten.
      - name: Build
        run: ./gradlew build -x dependencyCheckAnalyze
      - name: Integration tests (Testcontainers, Docker is available on the runner)
        run: ./gradlew integrationTest
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: reports
          path: |
            build/reports
            build/test-results
          if-no-files-found: ignore

  dependency-check:
    runs-on: ubuntu-latest
    env:
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
    steps:
      - name: Check for the NVD API key
        id: key
        run: |
          if [ -n "$NVD_API_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::NVD_API_KEY is not set as a repository secret, dependency check skipped."
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.key.outputs.present == 'true'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        if: steps.key.outputs.present == 'true'
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        if: steps.key.outputs.present == 'true'
      - name: Dependency check
        if: steps.key.outputs.present == 'true'
        run: ./gradlew dependencyCheckAnalyze

  server-smoke:
    # Echter Paper- und Folia-Lauf. Laeuft nur, wenn die Besitzerin oder der Besitzer die
    # Repository-Variable ACCEPT_MINECRAFT_EULA auf "true" gesetzt hat (Minecraft-EULA).
    if: ${{ vars.ACCEPT_MINECRAFT_EULA == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21
      - name: Paper and Folia smoke test (mcstage)
        env:
          ACCEPT_MINECRAFT_EULA: ${{ vars.ACCEPT_MINECRAFT_EULA }}
        run: tools/mcstage/run.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: mcstage-reports
          path: build/reports/mcstage*
