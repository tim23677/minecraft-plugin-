name: release

# Hinweis: Die Actions sind noch ueber Versions-Tags eingebunden. Renovate (helpers:pinGitHubActionDigests)
# schlaegt die Umstellung auf feste Commit-SHAs vor. Vor dem ersten Release diesen PR zusammenfuehren.

# Ein Git-Tag der Form v1.2.3 baut das Release: Jar, SHA256SUMS, Kaeufer- und Quellpaket,
# Provenance-Attestation und ein GitHub-Release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Check the tag matches build.gradle.kts
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' build.gradle.kts | head -1)"
          test "v${version}" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} does not match version ${version}"; exit 1; }
      - name: Build
        run: ./gradlew build -x dependencyCheckAnalyze
      - name: Package
        run: tools/release/package.sh
      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            dist/*.zip
            build/libs/OrderHub-*.jar
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/*.zip dist/SHA256SUMS \
            --title "OrderHub ${GITHUB_REF_NAME#v}" \
            --notes-file CHANGELOG.md
