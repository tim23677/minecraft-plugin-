name: OrderHub
version: '${version}'
main: dev.orderhub.OrderHubPlugin
api-version: '1.21'
folia-supported: true
softdepend: [Vault, PlaceholderAPI]
description: Player-to-player buy order marketplace with escrow, delivery and claims
commands:
  order:
    description: Open the OrderHub marketplace
    usage: /<command> [create|mine|market|claims|returns|deliver|cancel|help]
    aliases: [orderhub, orders]
    permission: orderhub.use
  orderadmin:
    description: OrderHub administration
    usage: /<command> <subcommand>
    permission: orderhub.admin
permissions:
  orderhub.use:
    description: Use OrderHub
    default: true
  orderhub.create:
    description: Create and manage own orders
    default: true
  orderhub.market:
    description: Browse the marketplace and deliver items
    default: true
  orderhub.stats:
    description: View statistics and history
    default: true
  orderhub.favorites:
    description: Use favorites and price alerts
    default: true
  orderhub.bypass.fee:
    description: No creation fee
    default: false
  orderhub.limit.5:
    description: Up to 5 open orders
    default: false
  orderhub.limit.10:
    description: Up to 10 open orders
    default: false
  orderhub.limit.25:
    description: Up to 25 open orders
    default: false
  orderhub.limit.50:
    description: Up to 50 open orders
    default: false
  orderhub.admin.reload:
    description: Reload the configuration
    default: op
  orderhub.admin.transactions:
    description: Inspect transactions
    default: op
  orderhub.admin.recovery:
    description: Run recovery and purge expired orders
    default: op
  orderhub.admin:
    description: All administration commands
    default: op
    children:
      orderhub.admin.reload: true
      orderhub.admin.transactions: true
      orderhub.admin.recovery: true
