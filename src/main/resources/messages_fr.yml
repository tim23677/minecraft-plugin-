# Fichier de langue OrderHub (MiniMessage). Les variables sont entre <chevrons>.
lang-version: 1
prefix: "<gradient:#4ea8de:#7b6cf6>OrderHub</gradient> <dark_gray>|</dark_gray> "

general:
  starting: "<yellow>OrderHub démarre encore. Réessayez dans un instant."
  help: "<gray>/order create [quantité] [prix] | mine | market [tri] | claims | returns | deliver <id> | cancel <id>"
  usage-create: "<gray>Tenez l'objet voulu et utilisez <white>/order create <quantité> <prix></white> ou simplement <white>/order create</white>."
  not-available: "<yellow>Cette fonction ne fait pas encore partie de cette version."
  no-permission: "<red>Vous n'avez pas la permission de faire cela."
  players-only: "<red>Cette commande est réservée aux joueurs."
  unknown-subcommand: "<red>Sous-commande inconnue. Utilisez <white>/order help</white>."
  invalid-number: "<red>'<input>' n'est pas un nombre valide."
  invalid-amount: "<red>'<input>' n'est pas un montant valide."
  busy: "<red>Le système est occupé. Réessayez dans un instant."
  database-error: "<red>Une erreur de base de données est survenue. Vos fonds sont en sécurité. Contactez un administrateur."
  reloaded: "<green>Configuration rechargée."
  cooldown: "<red>Veuillez patienter <seconds> secondes."

create:
  prompt-quantity: "<gray>Saisissez la quantité dans le chat, ou <white><cancel></white> pour annuler."
  prompt-price: "<gray>Saisissez le prix par objet dans le chat (par exemple <white>8</white> ou <white>1.5k</white>), ou <white><cancel></white> pour annuler."
  cancelled: "<gray>Création de la commande annulée."
  timeout: "<gray>Délai de saisie dépassé."
  summary: "<gray>Commande : <white><quantity>x <item></white> à <white><unit></white> l'unité. Total <white><total></white>, frais <white><fee></white>."
  insufficient-funds: "<red>Il vous faut <total> (frais compris) mais vous n'avez que <balance>."
  success: "<green>Commande n°<id> créée pour <quantity>x <item>. <total> sont bloqués en séquestre."
  limit-reached: "<red>Vous avez déjà <count> commandes ouvertes (limite <limit>)."
  cooldown: "<red>Veuillez patienter <seconds> s avant de créer une autre commande."
  fee-changed: "<red>Les frais sont passés à <fee> avant votre confirmation. Rien n'a été débité, recommencez."
  price-out-of-range: "<red>Le prix doit être compris entre <min> et <max>."
  quantity-out-of-range: "<red>La quantité doit être comprise entre 1 et <max>."
  item-rejected: "<red>Cet objet ne peut pas être commandé : <reason>."

reject:
  blocked: "objet bloqué"
  custom-name: "il porte un nom personnalisé"
  lore: "il a une description"
  enchanted: "il est enchanté"
  damaged: "il est abîmé"
  container: "il contient des objets"
  components: "il contient des données non prises en charge"
  air: "aucun objet sélectionné"

order:
  cancelled: "<yellow>Commande n°<id> annulée. <refund> remboursés."
  paused: "<yellow>Commande n°<id> mise en pause."
  resumed: "<green>Commande n°<id> reprise."
  expired: "<yellow>Commande n°<id> expirée. <refund> remboursés."
  not-found: "<red>Commande n°<id> introuvable."
  not-yours: "<red>Ce n'est pas votre commande."
  not-active: "<red>Cette commande n'accepte plus de livraisons."
  completed: "<green>Votre commande n°<id> pour <item> est terminée."

delivery:
  processing: "<yellow>Votre livraison est en cours de traitement. S'il manque des objets ou de l'argent, vérifiez bientôt /order claims et /order returns."
  success: "<green>Livré <quantity>x <item> à la commande n°<id>. Vous recevrez <amount>."
  below-minimum: "<red>Cette commande exige au moins <min> objets par livraison."
  own-order: "<red>Vous ne pouvez pas livrer à votre propre commande."
  nothing: "<gray>Aucun objet valide dans les emplacements de livraison."
  returned: "<yellow>Certains objets vous ont été rendus."
  stored-for-later: "<yellow>Votre inventaire est plein. <quantity>x <item> ont été mis de côté et peuvent être récupérés avec <white>/order claims</white>."
  payout: "<green>Vous avez reçu <amount> pour votre livraison."
  payout-delayed: "<yellow>Votre paiement de <amount> est en file d'attente et arrivera sous peu."

claim:
  nothing: "<gray>Vous n'avez rien à récupérer."
  success: "<green>Récupéré <quantity>x <item>."
  partial: "<yellow>Récupéré <quantity>x <item>. Le reste reste en réserve jusqu'à ce que vous ayez de la place."
  full: "<red>Votre inventaire est plein. Les objets restent en réserve."

market:
  empty: "<gray>Aucune commande ouverte ne correspond à votre filtre."
  search-prompt: "<gray>Saisissez le nom de l'objet à rechercher (par exemple <white>diamond</white>). <white>-</white> efface la recherche, <white><cancel></white> annule."
  no-data: "<gray>Pas assez de données de marché"
  recommendation: "<gray>Fourchette de prix recommandée pour <item> : <white><low></white> à <white><high></white> (d'après <trades> transactions en <days> jours)."

favorites:
  header: "<gradient:#4ea8de:#7b6cf6>Vos favoris</gradient>"
  empty: "<gray>Aucun favori. Tenez un objet et utilisez <white>/order favorites add</white>."
  line: "<gray><item> <dark_gray>|</dark_gray> alerte à partir de <white><alert></white>"
  alert-off: "<yellow>Alerte de prix pour <item> supprimée."
  unchanged: "<gray>Rien n'a changé pour <item>."
  not-a-favorite: "<red><item> n'est pas encore l'un de vos favoris. Ajoutez-le d'abord."
  added: "<green><item> ajouté aux favoris."
  removed: "<yellow><item> retiré des favoris."
  alert-set: "<green>Alerte de prix définie pour <item> à <price>."

notify:
  live-summary: "<aqua>À l'instant : <items> objets arrivés en <deliveries> livraisons, <expired> de vos commandes ont expiré."
  login-summary: "<aqua>Pendant votre absence : <items> objets arrivés en <deliveries> livraisons, <expired> de vos commandes ont expiré."
  price-alert: "<aqua>Alerte de prix : <quantity>x <item> recherché à <unit> l'unité (commande n°<id>)."
  claims-waiting: "<aqua>Vous avez <count> colis d'objets en attente. Utilisez <white>/order claims</white>."
  delivered: "<aqua>Commande n°<id> : <quantity>x <item> livré."
  new-order: "<aqua>Nouvelle commande pour <item> : <quantity>x à <unit> l'unité."
  summary: "<aqua>Vous avez <count> nouvelles notifications."

admin:
  transaction-not-found: "<yellow>Aucune transaction avec cet identifiant."
  entry: "<gray><entry>"
  ledger-line: "<gray>  <kind> <white><amount></white> <player>"
  warning: "<red>[OrderHub] <message>"
  help: "<gray>reload | list [statut] | cancel <id> confirm <raison> | purge-expired confirm <raison> | transactions [uuid-joueur] | transaction <uuid> | inspect <id> | recovery confirm <raison> | review list|show|resolve | health | dump | backup confirm <raison> | export orders|ledger confirm <raison> | statistics | debug"
  confirm-required: "<yellow>Répétez la commande avec <white>confirm</white> et une raison pour continuer."
  reason-required: "<red>Une raison est requise."
  cancelled: "<green>Commande n°<id> annulée par un administrateur. Raison enregistrée."
  recovery-started: "<gray>Récupération lancée."
  recovery-report: "<gray>Récupération terminée : <fixed> corrigés, <review> à examiner manuellement."
  purge-done: "<green><count> commandes expirées traitées."
  header: "<gradient:#4ea8de:#7b6cf6>Administration OrderHub</gradient>"
  statistics: "<gray>Actives <white><active></white>, en pause <white><paused></white>, terminées <white><completed></white>, annulées <white><cancelled></white>, expirées <white><expired></white>, examen manuel <white><review></white>."
  debug: "<gray>Serveur <white><server></white>, base de données <white><dialect></white>, menus ouverts <white><menus></white>."
  review-header: "<gradient:#4ea8de:#7b6cf6>Examen manuel</gradient> <gray>(<count>)"
  review-line: "<gray><white><id></white> <type> <amount> joueur <player> <detail>"
  review-usage: "<yellow>Utilisation : /orderadmin review resolve <tx> paid|refund|discard confirm <raison>"
  review-result: "<gray>Examen <white><tx></white> <how> : <white><status></white> (transaction de remboursement <refund>)"
  order-line: "<gray>n°<id> <white><item></white> <filled>/<total> à <unit>, propriétaire <owner>, <status>"
  health-db: "<gray>Pool de base de données : <white><active></white> actifs, <white><idle></white> libres, <white><waiting></white> en attente, <white><total></white> au total. Exécuteur : <white><running></white> en cours, <white><queued></white> en file."
  health-payments: "<gray>Paiements : <white><open></white> ouverts, <white><progress></white> en cours, <white><review></white> en examen manuel."
  dump-done: "<green>Fichier de support écrit : <file>. Vérifiez-le avant de le partager, les secrets, UUID et adresses IP sont retirés."
  health-economy: "<gray>Économie : <white><samples></white> appels mesurés, médiane <white><median></white> ms, maximum <white><max></white> ms, dernier <white><last></white> ms. Plus ancien paiement ouvert : <white><oldest></white> s."
  health-recovery: "<gray>Dernière récupération <white><at></white> : <summary>"
  health-recovery-none: "<gray>Aucune récupération depuis le démarrage."
  backup-done: "<green>Sauvegarde écrite : <file>"
