# OrderHub language file (MiniMessage). Placeholders in <angle> brackets.
lang-version: 1
prefix: "<gradient:#4ea8de:#7b6cf6>OrderHub</gradient> <dark_gray>|</dark_gray> "

general:
  starting: "<yellow>OrderHub is still starting. Please try again in a moment."
  help: "<gray>/order create [quantity] [price] | mine | market [sort] | claims | returns | deliver <id> | cancel <id>"
  usage-create: "<gray>Hold the item you want and use <white>/order create <quantity> <price></white> or just <white>/order create</white>."
  not-available: "<yellow>This feature is not part of this build yet."
  no-permission: "<red>You do not have permission to do that."
  players-only: "<red>This command can only be used by players."
  unknown-subcommand: "<red>Unknown subcommand. Use <white>/order help</white>."
  invalid-number: "<red>'<input>' is not a valid number."
  invalid-amount: "<red>'<input>' is not a valid amount."
  busy: "<red>The system is busy. Please try again in a moment."
  database-error: "<red>A database error occurred. Your funds are safe. Please contact an administrator."
  reloaded: "<green>Configuration reloaded."
  cooldown: "<red>Please wait <seconds> seconds."

create:
  prompt-quantity: "<gray>Type the quantity in chat, or <white><cancel></white> to abort."
  prompt-price: "<gray>Type the price per item in chat (for example <white>8</white> or <white>1.5k</white>), or <white><cancel></white> to abort."
  cancelled: "<gray>Order creation cancelled."
  timeout: "<gray>Input timed out."
  summary: "<gray>Order: <white><quantity>x <item></white> at <white><unit></white> each. Total <white><total></white>, fee <white><fee></white>."
  insufficient-funds: "<red>You need <total> (including fee) but only have <balance>."
  success: "<green>Order #<id> created for <quantity>x <item>. <total> is held in escrow."
  limit-reached: "<red>You already have <count> open orders (limit <limit>)."
  cooldown: "<red>Please wait <seconds>s before creating another order."
  fee-changed: "<red>The fee changed to <fee> before you confirmed. Nothing was charged, please start again."
  price-out-of-range: "<red>The price must be between <min> and <max>."
  quantity-out-of-range: "<red>The quantity must be between 1 and <max>."
  item-rejected: "<red>This item cannot be ordered: <reason>."

reject:
  blocked: "blocked item"
  custom-name: "it has a custom name"
  lore: "it has lore"
  enchanted: "it is enchanted"
  damaged: "it is damaged"
  container: "it contains items"
  components: "it has unsupported data"
  air: "no item selected"

order:
  cancelled: "<yellow>Order #<id> cancelled. <refund> refunded."
  paused: "<yellow>Order #<id> paused."
  resumed: "<green>Order #<id> resumed."
  expired: "<yellow>Order #<id> expired. <refund> refunded."
  not-found: "<red>Order #<id> not found."
  not-yours: "<red>This is not your order."
  not-active: "<red>This order is not accepting deliveries."
  completed: "<green>Your order #<id> for <item> is complete."

delivery:
  processing: "<yellow>Your delivery is being processed. If items or money are missing, check /order claims and /order returns shortly."
  success: "<green>Delivered <quantity>x <item> to order #<id>. You will receive <amount>."
  below-minimum: "<red>This order requires at least <min> items per delivery."
  own-order: "<red>You cannot deliver to your own order."
  nothing: "<gray>No valid items in the delivery slots."
  returned: "<yellow>Some items were returned to you."
  stored-for-later: "<yellow>Your inventory is full. <quantity>x <item> were stored and can be collected with <white>/order claims</white>."
  payout: "<green>You received <amount> for your delivery."
  payout-delayed: "<yellow>Your payout of <amount> is queued and will arrive shortly."

claim:
  nothing: "<gray>You have nothing to collect."
  success: "<green>Collected <quantity>x <item>."
  partial: "<yellow>Collected <quantity>x <item>. The rest stays stored until you have space."
  full: "<red>Your inventory is full. Items stay stored."

market:
  empty: "<gray>No open orders match your filter."
  search-prompt: "<gray>Type the item name to search for (for example <white>diamond</white>). <white>-</white> clears the search, <white><cancel></white> aborts."
  no-data: "<gray>Not enough market data"
  recommendation: "<gray>Recommended price range for <item>: <white><low></white> to <white><high></white> (based on <trades> trades in <days> days)."

favorites:
  header: "<gradient:#4ea8de:#7b6cf6>Your favorites</gradient>"
  empty: "<gray>No favorites. Hold an item and use <white>/order favorites add</white>."
  line: "<gray><item> <dark_gray>|</dark_gray> alert from <white><alert></white>"
  alert-off: "<yellow>Price alert for <item> removed."
  unchanged: "<gray>Nothing changed for <item>."
  not-a-favorite: "<red><item> is not one of your favorites yet. Add it first."
  added: "<green><item> added to favorites."
  removed: "<yellow><item> removed from favorites."
  alert-set: "<green>Price alert set for <item> at <price>."

notify:
  live-summary: "<aqua>Just now: <items> items arrived in <deliveries> deliveries, <expired> of your orders expired."
  login-summary: "<aqua>While you were away: <items> items arrived in <deliveries> deliveries, <expired> of your orders expired."
  price-alert: "<aqua>Price alert: <quantity>x <item> wanted at <unit> each (order #<id>)."
  claims-waiting: "<aqua>You have <count> item packages waiting. Use <white>/order claims</white>."
  delivered: "<aqua>Order #<id>: <quantity>x <item> delivered."
  new-order: "<aqua>New order for <item>: <quantity>x at <unit> each."
  summary: "<aqua>You have <count> new notifications."

admin:
  transaction-not-found: "<yellow>No transaction with that id."
  entry: "<gray><entry>"
  ledger-line: "<gray>  <kind> <white><amount></white> <player>"
  warning: "<red>[OrderHub] <message>"
  help: "<gray>reload | list [status] | cancel <id> confirm <reason> | purge-expired confirm <reason> | transactions [player-uuid] | transaction <uuid> | inspect <id> | recovery confirm <reason> | review list|show|resolve | health | dump | backup confirm <reason> | export orders|ledger confirm <reason> | statistics | debug"
  confirm-required: "<yellow>Repeat the command with <white>confirm</white> and a reason to proceed."
  reason-required: "<red>A reason is required."
  cancelled: "<green>Order #<id> cancelled by an administrator. Reason logged."
  recovery-started: "<gray>Recovery started."
  recovery-report: "<gray>Recovery finished: <fixed> fixed, <review> need manual review."
  purge-done: "<green>Processed <count> expired orders."
  header: "<gradient:#4ea8de:#7b6cf6>OrderHub admin</gradient>"
  statistics: "<gray>Active <white><active></white>, paused <white><paused></white>, completed <white><completed></white>, cancelled <white><cancelled></white>, expired <white><expired></white>, manual review <white><review></white>."
  debug: "<gray>Server <white><server></white>, database <white><dialect></white>, open menus <white><menus></white>."
  review-header: "<gradient:#4ea8de:#7b6cf6>Manual review</gradient> <gray>(<count>)"
  review-line: "<gray><white><id></white> <type> <amount> player <player> <detail>"
  review-usage: "<yellow>Usage: /orderadmin review resolve <tx> paid|refund|discard confirm <reason>"
  review-result: "<gray>Review <white><tx></white> <how>: <white><status></white> (refund transaction <refund>)"
  order-line: "<gray>#<id> <white><item></white> <filled>/<total> at <unit>, owner <owner>, <status>"
  health-db: "<gray>Database pool: <white><active></white> active, <white><idle></white> idle, <white><waiting></white> waiting, <white><total></white> total. Executor: <white><running></white> running, <white><queued></white> queued."
  health-payments: "<gray>Payments: <white><open></white> open, <white><progress></white> in progress, <white><review></white> in manual review."
  dump-done: "<green>Support file written: <file>. Check it before you share it, secrets, UUIDs and IP addresses are removed."
  health-economy: "<gray>Economy: <white><samples></white> measured calls, median <white><median></white> ms, maximum <white><max></white> ms, last <white><last></white> ms. Oldest open payment: <white><oldest></white> s."
  health-recovery: "<gray>Last recovery <white><at></white>: <summary>"
  health-recovery-none: "<gray>No recovery run yet since start."
  backup-done: "<green>Backup written: <file>"
  backup-failed: "<red><reason>"
  export-usage: "<yellow>Usage: /orderadmin export orders|ledger confirm <reason>"
  export-done: "<green>Exported <rows> rows to <file>"
  recovery-summary: "<gray><summary>"
  transaction: "<gray>Transaction <white><id></white> <state> <amount> player <player>"

menu:
  market:
    category: "<yellow>Category: <white><category>"
    category-hint: "<gray>Click to change the category"
    sort: "<yellow>Sort: <white><sort>"
    sort-hint: "<gray>Click to change the sort order"
    search: "<yellow>Search: <white><text>"
    search-hint: "<gray>Click and type an item name in chat"
  delivery-info: "<yellow>Delivery preview"
  main:
    market: "<green>Marketplace"
    market-hint: "<gray>Browse open orders and deliver items"
    mine: "<green>My orders"
    mine-hint: "<gray>Left click: cancel, right click: pause or resume"
    create: "<green>Create order"
    create-hint: "<gray>Hold an item and use /order create"
    claims: "<green>Collect items"
    claims-hint: "<gray>Items delivered to your orders"
    stats: "<green>Statistics"
    stats-hint: "<gray>Your trading numbers"
    favorites: "<green>Favorites"
    favorites-hint: "<gray>Watched items and price alerts"
    history: "<green>Trade history"
    history-hint: "<gray>Your past trades"
  main-title: "OrderHub"
  marketplace-title: "Marketplace"
  create-title: "Create order"
  details-title: "Order #<id>"
  delivery-title: "Deliver to order #<id>"
  my-orders-title: "My orders"
  claims-title: "Collect items"
  favorites-title: "Favorites"
  analytics-title: "Market analytics"
  statistics-title: "Your statistics"
  history-title: "Trade history"
  admin-title: "Admin dashboard"
  inspector-title: "Transaction <id>"
  confirm-title: "Confirm"
  back: "<gray>Back"
  next: "<yellow>Next page"
  previous: "<yellow>Previous page"
  confirm: "<green>Confirm"
  cancel: "<red>Cancel"
  deliver: "<green>Deliver"
  search: "<yellow>Search"
  sort: "<yellow>Sort: <white><sort>"
  favorite-on: "<yellow>Remove from favorites"
  favorite-off: "<yellow>Add to favorites"

sort:
  NEWEST: "Newest"
  HIGHEST_PRICE: "Highest price"
  LOWEST_PRICE: "Lowest price"
  ALMOST_COMPLETED: "Almost completed"
  HIGHEST_DEMAND: "Highest demand"
  newest: "Newest"
  highest-price: "Highest price"
  lowest-price: "Lowest price"
  almost-completed: "Almost completed"
  highest-demand: "Highest demand"

lore:
  delivery-accepted: "<gray>Accepted: <white><quantity></white> of <white><remaining></white> still needed"
  delivery-gross: "<gray>Gross payout: <white><amount>"
  claim-quantity: "<gray>Waiting: <white><quantity>"
  order-unit: "<gray>Price each: <white><unit>"
  order-progress: "<gray>Progress: <white><filled>/<total> <gray>(<percent>%)"
  order-owner: "<gray>Buyer: <white><owner>"
  order-escrow: "<gray>Held in escrow: <white><escrow>"
  order-expires: "<gray>Expires in: <white><time>"
  order-min: "<gray>Minimum delivery: <white><min>"

stats:
  header: "<gradient:#4ea8de:#7b6cf6>Your statistics</gradient>"
  empty: "<gray>No trades yet."
  line: "<gray>Orders created <white><created></white>, completed <white><completed></white> (<rate>%). Delivered <white><delivered></white> items for <white><earned></white>. Received <white><received></white> items for <white><spent></white>."

history:
  header: "<gradient:#4ea8de:#7b6cf6>Your recent deliveries</gradient>"
  empty: "<gray>No deliveries yet."
  line: "<gray>Order #<order>: <white><quantity></white> items, <white><amount></white> gross (<state>)"

analytics:
  header: "<gradient:#4ea8de:#7b6cf6>Market: <item></gradient> <gray>(based on completed OrderHub trades and open orders)"
  top-header: "<gray>Items with the most open orders:"
  top-line: "<gray> <white><item></white>"
  demand: "<gray>Open demand: <white><orders></white> orders, <white><units></white> items. Price low <white><low></white>, high <white><high></white>, median <white><median></white>, average <white><avg></white>."
  no-demand: "<gray>No open orders for this item."
  trades: "<gray><days> day(s): <white><trades></white> trades, <white><units></white> items, volume <white><volume></white>, median <white><median></white>, average <white><avg></white>."
  no-trades: "<gray><days> day(s): no completed trades."

category:
  all: "All"
  ores: "Ores"
  blocks: "Blocks"
  farm: "Farm products"
  mob-drops: "Mob drops"
  tools: "Tools"
  potions: "Potions"
  misc: "Miscellaneous"

sell:
  no-item: "<red>Hold the item you want to sell in your main hand."
  hand-changed: "<red>The item in your hand changed. Please try again."
  no-order: "<gray>No open order wants this item right now."
  none-fits: "<gray>Open orders exist for this item, but none accepts what you have (minimum delivery, quality or your own order)."

insight:
  value: "<white><value>"
  stats:
    created: "<yellow>Orders created"
    completed: "<green>Orders completed"
    delivered: "<aqua>Items delivered"
    received: "<aqua>Items received"
    earned: "<gold>Money earned"
    spent: "<red>Money spent"
  history:
    title: "<yellow>Order #<order>"
  favorites:
    hint: "<dark_gray>Left click: market analysis, right click: remove"

template:
  saved: "<green>Saved template <white><name></white>."
  list-header: "<gold>Your templates:"
  list-entry: "<gray>- <white><name></white>: <quantity>x <item> at <unit> each"
  empty: "<gray>You have no templates. Save one with <white>/order template save [name] [quantity] [price]</white>."
  deleted: "<green>Deleted template <white><name></white>."
  not-found: "<red>No template named <white><name></white>."
  limit: "<red>You reached the limit of <max> templates. Delete one first."
  usage: "<gray>Use <white>/order template save|use|delete [name]</white> or <white>/order template list</white>."

renew:
  on: "<green>Auto renew for order #<id> is on. When it expires and the escrow is still held, it gets a new lifetime."
  off: "<green>Auto renew for order #<id> is off."
  unchanged: "<gray>Auto renew for order #<id> already has this setting."
  usage: "<gray>Use <white>/order renew [id] on|off</white>."
