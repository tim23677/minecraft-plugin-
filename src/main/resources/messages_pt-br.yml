  confirm-required: "<yellow>Repita o comando com <white>confirm</white> e um motivo para continuar."
  reason-required: "<red>É necessário informar um motivo."
  cancelled: "<green>Pedido nº <id> cancelado por um administrador. Motivo registrado."
  recovery-started: "<gray>Recuperação iniciada."
  recovery-report: "<gray>Recuperação concluída: <fixed> corrigidos, <review> precisam de revisão manual."
  purge-done: "<green><count> pedidos expirados processados."
  header: "<gradient:#4ea8de:#7b6cf6>Administração do OrderHub</gradient>"
  statistics: "<gray>Ativos <white><active></white>, pausados <white><paused></white>, concluídos <white><completed></white>, cancelados <white><cancelled></white>, expirados <white><expired></white>, revisão manual <white><review></white>."
  debug: "<gray>Servidor <white><server></white>, banco de dados <white><dialect></white>, menus abertos <white><menus></white>."
