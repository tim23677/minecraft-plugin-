# Arquivo de idioma do OrderHub (MiniMessage). As variáveis ficam entre <colchetes angulares>.
lang-version: 1
prefix: "<gradient:#4ea8de:#7b6cf6>OrderHub</gradient> <dark_gray>|</dark_gray> "

general:
  starting: "<yellow>O OrderHub ainda está iniciando. Tente novamente daqui a pouco."
  help: "<gray>/order create [quantidade] [preço] | mine | market [ordem] | claims | returns | deliver <id> | cancel <id>"
  usage-create: "<gray>Segure o item desejado e use <white>/order create <quantidade> <preço></white> ou apenas <white>/order create</white>."
  not-available: "<yellow>Este recurso ainda não faz parte desta versão."
  no-permission: "<red>Você não tem permissão para fazer isso."
  players-only: "<red>Este comando só pode ser usado por jogadores."
  unknown-subcommand: "<red>Subcomando desconhecido. Use <white>/order help</white>."
  invalid-number: "<red>'<input>' não é um número válido."
  invalid-amount: "<red>'<input>' não é um valor válido."
  busy: "<red>O sistema está ocupado. Tente novamente daqui a pouco."
  database-error: "<red>Ocorreu um erro no banco de dados. Seus fundos estão seguros. Entre em contato com um administrador."
  reloaded: "<green>Configuração recarregada."
  cooldown: "<red>Aguarde <seconds> segundos."

create:
  prompt-quantity: "<gray>Digite a quantidade no chat ou <white><cancel></white> para cancelar."
  prompt-price: "<gray>Digite o preço por item no chat (por exemplo <white>8</white> ou <white>1.5k</white>) ou <white><cancel></white> para cancelar."
  cancelled: "<gray>Criação do pedido cancelada."
  timeout: "<gray>O tempo para digitar acabou."
  summary: "<gray>Pedido: <white><quantity>x <item></white> a <white><unit></white> cada. Total <white><total></white>, taxa <white><fee></white>."
  options: "<gray>Opções: <white><options>"
  option-durability: "durabilidade mínima <percent>%"
  option-enchants: "encantamentos no mínimo"
  option-autoclaim: "coleta automática"
  options-invalid: "<gray>Opção desconhecida <white><input></white>. Use <white>durability=0-100</white>, <white>enchants</white> ou <white>autoclaim</white>."
  insufficient-funds: "<red>Você precisa de <total> (com a taxa), mas só tem <balance>."
  success: "<green>Pedido nº <id> criado para <quantity>x <item>. <total> ficam retidos em custódia."
  limit-reached: "<red>Você já tem <count> pedidos abertos (limite <limit>)."
  cooldown: "<red>Aguarde <seconds> s antes de criar outro pedido."
  fee-changed: "<red>A taxa mudou para <fee> antes de você confirmar. Nada foi cobrado, comece de novo."
  price-out-of-range: "<red>O preço deve ficar entre <min> e <max>."
  quantity-out-of-range: "<red>A quantidade deve ficar entre 1 e <max>."
  item-rejected: "<red>Este item não pode ser pedido: <reason>."

reject:
  blocked: "item bloqueado"
  custom-name: "tem um nome personalizado"
  lore: "tem descrição"
  enchanted: "está encantado"
  damaged: "está danificado"
  container: "contém itens"
  components: "tem dados não suportados"
  air: "nenhum item selecionado"

order:
  cancelled: "<yellow>Pedido nº <id> cancelado. <refund> reembolsados."
  paused: "<yellow>Pedido nº <id> pausado."
  resumed: "<green>Pedido nº <id> retomado."
  expired: "<yellow>Pedido nº <id> expirou. <refund> reembolsados."
  not-found: "<red>Pedido nº <id> não encontrado."
  not-yours: "<red>Este pedido não é seu."
  not-active: "<red>Este pedido não aceita mais entregas."
  completed: "<green>Seu pedido nº <id> de <item> foi concluído."
  info: "<yellow>Pedido #<id>: <white><filled>/<total>x <item></white> <gray>a <unit> cada, status <status>, termina em <hours> h. Opções: <options>"
  info-usage: "<gray>Use <white>/order info <id></white>."

delivery:
  processing: "<yellow>Sua entrega está sendo processada. Se faltarem itens ou dinheiro, confira em breve /order claims e /order returns."
  success: "<green>Entregue <quantity>x <item> ao pedido nº <id>. Você receberá <amount>."
  below-minimum: "<red>Este pedido exige pelo menos <min> itens por entrega."
  own-order: "<red>Você não pode entregar ao seu próprio pedido."
  nothing: "<gray>Nenhum item válido nos espaços de entrega."
  returned: "<yellow>Alguns itens foram devolvidos a você."
  stored-for-later: "<yellow>Seu inventário está cheio. <quantity>x <item> foram guardados e podem ser retirados com <white>/order claims</white>."
  payout: "<green>Você recebeu <amount> pela sua entrega."
  payout-delayed: "<yellow>Seu pagamento de <amount> está na fila e chegará em breve."

claim:
  nothing: "<gray>Você não tem nada para retirar."
  success: "<green>Retirados <quantity>x <item>."
  partial: "<yellow>Retirados <quantity>x <item>. O restante fica guardado até você ter espaço."
  full: "<red>Seu inventário está cheio. Os itens continuam guardados."

market:
  empty: "<gray>Nenhum pedido aberto corresponde ao seu filtro."
  search-slow: "<gray>Você pesquisa rápido demais. Aguarde alguns segundos."
  search-prompt: "<gray>Digite o nome do item que procura (por exemplo <white>diamond</white>). <white>-</white> limpa a busca, <white><cancel></white> cancela."
  no-data: "<gray>Dados de mercado insuficientes"
  recommendation: "<gray>Faixa de preço recomendada para <item>: <white><low></white> a <white><high></white> (com base em <trades> negociações em <days> dias)."

favorites:
  header: "<gradient:#4ea8de:#7b6cf6>Seus favoritos</gradient>"
  empty: "<gray>Sem favoritos. Segure um item e use <white>/order favorites add</white>."
  line: "<gray><item> <dark_gray>|</dark_gray> alerta a partir de <white><alert></white>"
  alert-off: "<yellow>Alerta de preço de <item> removido."
  unchanged: "<gray>Nada mudou para <item>."
  not-a-favorite: "<red><item> ainda não é um dos seus favoritos. Adicione primeiro."
  added: "<green><item> adicionado aos favoritos."
  removed: "<yellow><item> removido dos favoritos."
  alert-set: "<green>Alerta de preço definido para <item> em <price>."

notify:
