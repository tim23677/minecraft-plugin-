  login-summary: "<aqua>Enquanto você estava fora: <items> itens chegaram em <deliveries> entregas, <expired> dos seus pedidos expiraram."
  price-alert: "<aqua>Alerta de preço: procura-se <quantity>x <item> a <unit> cada (pedido nº <id>)."
  claims-waiting: "<aqua>Você tem <count> pacotes de itens aguardando. Use <white>/order claims</white>."
  delivered: "<aqua>Pedido nº <id>: <quantity>x <item> entregues."
  new-order: "<aqua>Novo pedido de <item>: <quantity>x a <unit> cada."
  summary: "<aqua>Você tem <count> novas notificações."

