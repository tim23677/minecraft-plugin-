  order-line: "<gray>nº <id> <white><item></white> <filled>/<total> a <unit>, dono <owner>, <status>"
  health-db: "<gray>Pool do banco de dados: <white><active></white> ativas, <white><idle></white> livres, <white><waiting></white> aguardando, <white><total></white> no total. Executor: <white><running></white> em execução, <white><queued></white> na fila."
  health-payments: "<gray>Pagamentos: <white><open></white> abertos, <white><progress></white> em andamento, <white><review></white> em revisão manual."
  dump-done: "<green>Arquivo de suporte gravado: <file>. Confira antes de compartilhar, segredos, UUIDs e endereços IP foram removidos."
  health-economy: "<gray>Economia: <white><samples></white> chamadas medidas, mediana <white><median></white> ms, máximo <white><max></white> ms, última <white><last></white> ms. Pagamento aberto mais antigo: <white><oldest></white> s."
