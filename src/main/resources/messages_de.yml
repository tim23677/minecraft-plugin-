# OrderHub Sprachdatei (MiniMessage). Platzhalter in <spitzen> Klammern.
lang-version: 1
prefix: "<gradient:#4ea8de:#7b6cf6>OrderHub</gradient> <dark_gray>|</dark_gray> "

