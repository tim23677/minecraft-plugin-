  not-available: "<yellow>Diese Funktion ist in diesem Build noch nicht enthalten."
  no-permission: "<red>Dafür fehlt dir die Berechtigung."
  players-only: "<red>Dieser Befehl ist nur für Spieler."
  unknown-subcommand: "<red>Unbekannter Unterbefehl. Nutze <white>/order help</white>."
  invalid-number: "<red>'<input>' ist keine gültige Zahl."
  invalid-amount: "<red>'<input>' ist kein gültiger Betrag."
