# OrderHub: Hauptkonfiguration / main configuration
# config-version wird vom Plugin verwaltet. Nicht aendern. / Managed by the plugin, do not edit.
config-version: 3

# Eindeutige Kennung dieses Servers. Bei mehreren Servern an einer gemeinsamen Datenbank
# muss jeder Server eine andere Kennung haben. Erlaubt: a-z, 0-9, Bindestrich, max. 32 Zeichen.
# Unique id of this server. Every server sharing a database needs its own id.
server-id: "main"

# Sprache der Spielertexte: en oder de (Dateien messages_<sprache>.yml direkt in plugins/OrderHub). / Message language.
language: "en"

# Debug-Ausgaben in der Konsole (keine vertraulichen Daten). / Extra console output.
debug: false

storage:
  # sqlite (ein Server, Standard) oder mariadb (mehrere Server, MariaDB). Aenderungen brauchen einen Neustart.
  type: "sqlite"
  sqlite:
    # Dateiname im Plugin-Ordner, ohne Pfadteile.
    file: "orderhub.db"
  mariadb:
    # Vollstaendige JDBC-URL. Fuer nicht lokale Server sslMode=verify-full oder verify-ca anhaengen.
    jdbc-url: "jdbc:mariadb://localhost:3306/orderhub?sslMode=disable"
    user: "orderhub"
    # NAME der Umgebungsvariable, die das Passwort enthaelt. Das Passwort selbst steht nie in dieser Datei.
    password-env: "ORDERHUB_DB_PASSWORD"
    pool-size: 10
  # Wiederholungen bei Deadlock oder Lock-Konflikt.
  retry:
    max-attempts: 5
    initial-backoff-ms: 25
    max-backoff-ms: 500

orders:
  # Preisgrenzen pro Stueck, Schreibweise wie im Spiel (z. B. 0.01, 1k, 2.5m).
  min-unit-price: "0.01"
  max-unit-price: "1000000"
  # Maximale Menge pro Auftrag.
  max-quantity: 2304
  # Standard-Limit offener Auftraege. Permissions orderhub.limit.5/10/25/50 erhoehen es,
  # es gilt das hoechste zutreffende Limit.
  default-max-open-orders: 3
  # Laufzeit in Stunden, danach laeuft der Auftrag ab und der Restbetrag wird erstattet.
  expiry-hours: 168
  # Eigener Abbruchbegriff bei Chat-Eingaben.
  cancel-word: "cancel"
  # Sekunden, die eine Chat-Eingabe wartet.
  input-timeout-seconds: 60
  # Mindestabstand in Sekunden zwischen zwei Auftragserstellungen eines Spielers (0 = aus).
  create-cooldown-seconds: 5

fees:
  # Gebuehren in Basispunkten (100 = 1 %). Permission orderhub.bypass.fee befreit von der Erstellgebuehr.
  create-fee-bp: 100
  sales-tax-bp: 200

items:
  # Standardmaessig abgelehnt. Mit true zulassen.
  allow-custom-name: false
  allow-lore: false
  allow-enchanted: false
  allow-damaged: false
  # Voreinstellungen fuer Items, deren Besonderheit in einer Datenkomponente liegt. Sie lassen diese
  # Items in Auftraegen zu. Geliefert werden muss weiter exakt das Bestellte (gleicher Effekt,
  # gleiche Form, gleiches Muster). Verfuegbar:
  #   potions          Traenke, Wurftraenke, Verweiltraenke (minecraft:potion_contents)
  #   arrows           Pfeile mit Effekt (minecraft:potion_contents)
  #   fireworks        Feuerwerksraketen und -sterne (minecraft:fireworks, firework_explosion)
  #   goat-horns       Ziegenhoerner (minecraft:instrument)
  #   banners          gemusterte Banner (minecraft:banner_patterns)
  #   ominous-bottles  unheilvolle Flaschen (minecraft:ominous_bottle_amplifier)
  #   player-heads     Spielerkoepfe (minecraft:profile)
  #   all              alle oben genannten
  # Eine Voreinstellung entfernen, damit diese Items wieder abgelehnt werden. [] = alles abgelehnt.
  component-presets:
    - potions
    - arrows
    - fireworks
    - goat-horns
    - banners
    - ominous-bottles
    - player-heads
  # Weitere einzeln zugelassene Datenkomponenten (Schluessel wie minecraft:repair_cost). Auch hier
  # wird exakt verglichen.
  allowed-components: []
  # Zusaetzlich gesperrte Items (Material-Keys wie minecraft:elytra).
  blocked-materials: []
  # Zusaetzlich gesperrte Item-Tags (z. B. minecraft:banners).
  blocked-tags: []

delivery:
  # Sekunden Ruhezeit zwischen zwei Klicks im Menue (Schutz vor Doppelklicks).
  click-debounce-ms: 150

cache:
  # Maximale Eintraege des Platzhalter-Caches (PlaceholderAPI). Die Datenbank ist immer die Wahrheit.
  max-entries: 5000

economy:
  # false (Standard): Vault-Aufrufe laufen auf dem globalen Server-Thread, wie es EssentialsX, CMI
  # und die meisten Economy-Plugins erwarten. true nur, wenn der Provider nachweislich threadsicher ist.
  async-safe: false
  # Wartezeit auf eine Vault-Antwort. Wurde der Aufruf bis dahin nie gestartet (z. B. Lag-Spike),
  # ist sicher kein Geld geflossen und die Zahlung wird mit Backoff wiederholt. Wurde er gestartet
  # und nicht beendet, gilt die Zahlung als unklar (MANUAL_REVIEW).
  timeout-ms: 3000

payouts:
  # Wie oft die Auszahlungswarteschlange abgearbeitet wird.
  worker-interval-seconds: 2
  # Maximale Wiederholungen bei sicher nicht ausgefuehrten Zahlungen.
  max-attempts: 5

market:
  # Mindestanzahl abgeschlossener Handelsgeschaefte fuer eine Preisempfehlung.
  min-trades-for-recommendation: 5

notifications:
  # Mindestabstand zwischen zwei Benachrichtigungen gleicher Art an einen Spieler.
  cooldown-seconds: 60
  # Wie die Zusammenfassung beim Login angezeigt wird: chat, actionbar oder title.
  display: chat
  # Ton bei der Zusammenfassung, zum Beispiel entity.experience_orb.pickup. Leer = kein Ton.
  sound: ""

logging:
  # Eine strukturierte Zeile je Geld- und Item-Bewegung (Transaktions-Id, Spieler-UUID, Betrag,
  # Zustand). Die Datei liegt in plugins/OrderHub/logs und rotiert. Neustart noetig.
  transactions:
    # Zeilen zusaetzlich in die Serverkonsole schreiben.
    console: false
    # Zeilen in logs/transactions.<n>.log schreiben.
    file: true
    file-max-mb: 10
    file-count: 5

health:
  # Warnung im Log (einmal beim Ueberschreiten, nicht bei jeder Pruefung). 0 schaltet eine Pruefung ab.
  warn:
    economy-latency-ms: 1000
    open-payments: 50
    oldest-payment-minutes: 10
    manual-review: 1

backup:
  # Zeitgesteuerte Sicherung der SQLite-Datenbank nach plugins/OrderHub/backups (VACUUM INTO).
  # Bei MariaDB ohne Wirkung: dort mysqldump oder einen Snapshot des Datenbankservers verwenden.
  # Neustart noetig.
  auto:
    enabled: true
    interval-hours: 24
    keep: 7

metrics:
  # Anonyme Nutzungsstatistik ueber bStats (Version, Datenbanktyp, Sprache). Keine Spielerdaten.
  # false schaltet sie fuer OrderHub ab, serverweit geht das in plugins/bStats/config.yml.
  # Neustart noetig.
  enabled: true

retention:
  # Aufbewahrung von Preisverlauf und Markt-Snapshots in Tagen.
  history-days: 120
  # Hintergrundbereinigung, Minuten zwischen zwei Laeufen.
  cleanup-interval-minutes: 30

updates:
  # Pruefung auf neue Versionen gegen die GitHub-Releases eines Repositories. Standard: aus.
  # Es wird nur die Versionsnummer abgefragt, es werden keine Daten gesendet.
  check: false
  # Repository im Format owner/name, das die Releases veroeffentlicht.
  repository: ""
