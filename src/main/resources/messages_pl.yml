  insufficient-funds: "<red>Potrzebujesz <total> (z opłatą), a masz tylko <balance>."
  success: "<green>Zlecenie nr <id> utworzone dla <quantity>x <item>. <total> zostało zablokowane w depozycie."
  limit-reached: "<red>Masz już <count> otwartych zleceń (limit <limit>)."
  cooldown: "<red>Poczekaj <seconds> s przed utworzeniem kolejnego zlecenia."
  fee-changed: "<red>Opłata zmieniła się na <fee> przed potwierdzeniem. Nic nie pobrano, zacznij od nowa."
