# Plik językowy OrderHub (MiniMessage). Zmienne są w nawiasach <ostrych>.
lang-version: 1
prefix: "<gradient:#4ea8de:#7b6cf6>OrderHub</gradient> <dark_gray>|</dark_gray> "

general:
  starting: "<yellow>OrderHub jeszcze się uruchamia. Spróbuj ponownie za chwilę."
  help: "<gray>/order create [ilość] [cena] | mine | market [sortowanie] | claims | returns | deliver <id> | cancel <id>"
  usage-create: "<gray>Weź do ręki przedmiot i użyj <white>/order create <ilość> <cena></white> albo samo <white>/order create</white>."
  not-available: "<yellow>Ta funkcja nie jest jeszcze częścią tej wersji."
  no-permission: "<red>Nie masz uprawnień, aby to zrobić."
