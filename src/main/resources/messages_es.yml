# Archivo de idioma de OrderHub (MiniMessage). Las variables van entre <corchetes angulares>.
lang-version: 1
prefix: "<gradient:#4ea8de:#7b6cf6>OrderHub</gradient> <dark_gray>|</dark_gray> "

general:
  starting: "<yellow>OrderHub todavía se está iniciando. Inténtalo de nuevo en un momento."
  help: "<gray>/order create [cantidad] [precio] | mine | market [orden] | claims | returns | deliver <id> | cancel <id>"
  usage-create: "<gray>Sostén el objeto que quieres y usa <white>/order create <cantidad> <precio></white> o solo <white>/order create</white>."
  not-available: "<yellow>Esta función todavía no forma parte de esta versión."
  no-permission: "<red>No tienes permiso para hacer eso."
  players-only: "<red>Este comando solo lo pueden usar jugadores."
  unknown-subcommand: "<red>Subcomando desconocido. Usa <white>/order help</white>."
  invalid-number: "<red>'<input>' no es un número válido."
  invalid-amount: "<red>'<input>' no es una cantidad válida."
  busy: "<red>El sistema está ocupado. Inténtalo de nuevo en un momento."
  database-error: "<red>Se produjo un error de base de datos. Tus fondos están a salvo. Contacta con un administrador."
  reloaded: "<green>Configuración recargada."
  cooldown: "<red>Espera <seconds> segundos."

create:
  prompt-quantity: "<gray>Escribe la cantidad en el chat, o <white><cancel></white> para cancelar."
  prompt-price: "<gray>Escribe el precio por objeto en el chat (por ejemplo <white>8</white> o <white>1.5k</white>), o <white><cancel></white> para cancelar."
  cancelled: "<gray>Creación del pedido cancelada."
  timeout: "<gray>Se agotó el tiempo de entrada."
  summary: "<gray>Pedido: <white><quantity>x <item></white> a <white><unit></white> cada uno. Total <white><total></white>, tarifa <white><fee></white>."
  insufficient-funds: "<red>Necesitas <total> (con la tarifa) pero solo tienes <balance>."
  success: "<green>Pedido n.º <id> creado para <quantity>x <item>. <total> quedan retenidos en depósito."
  limit-reached: "<red>Ya tienes <count> pedidos abiertos (límite <limit>)."
  cooldown: "<red>Espera <seconds> s antes de crear otro pedido."
  fee-changed: "<red>La tarifa cambió a <fee> antes de que confirmaras. No se cobró nada, empieza de nuevo."
  price-out-of-range: "<red>El precio debe estar entre <min> y <max>."
  quantity-out-of-range: "<red>La cantidad debe estar entre 1 y <max>."
  item-rejected: "<red>Este objeto no se puede pedir: <reason>."

reject:
  blocked: "objeto bloqueado"
  custom-name: "tiene un nombre personalizado"
  lore: "tiene descripción"
  enchanted: "está encantado"
  damaged: "está dañado"
  container: "contiene objetos"
  components: "tiene datos no compatibles"
  air: "no hay ningún objeto seleccionado"

order:
  cancelled: "<yellow>Pedido n.º <id> cancelado. Se reembolsaron <refund>."
  paused: "<yellow>Pedido n.º <id> en pausa."
  resumed: "<green>Pedido n.º <id> reanudado."
  expired: "<yellow>Pedido n.º <id> caducado. Se reembolsaron <refund>."
  not-found: "<red>No se encontró el pedido n.º <id>."
  not-yours: "<red>Este pedido no es tuyo."
  not-active: "<red>Este pedido ya no acepta entregas."
  completed: "<green>Tu pedido n.º <id> de <item> está completo."

delivery:
  processing: "<yellow>Tu entrega se está procesando. Si faltan objetos o dinero, revisa pronto /order claims y /order returns."
  success: "<green>Entregados <quantity>x <item> al pedido n.º <id>. Recibirás <amount>."
  below-minimum: "<red>Este pedido exige al menos <min> objetos por entrega."
  own-order: "<red>No puedes entregar a tu propio pedido."
  nothing: "<gray>No hay objetos válidos en las casillas de entrega."
  returned: "<yellow>Algunos objetos te fueron devueltos."
  stored-for-later: "<yellow>Tu inventario está lleno. <quantity>x <item> se guardaron y puedes recogerlos con <white>/order claims</white>."
  payout: "<green>Recibiste <amount> por tu entrega."
  payout-delayed: "<yellow>Tu pago de <amount> está en cola y llegará en breve."

claim:
  nothing: "<gray>No tienes nada que recoger."
  success: "<green>Recogidos <quantity>x <item>."
  partial: "<yellow>Recogidos <quantity>x <item>. El resto queda guardado hasta que tengas espacio."
  full: "<red>Tu inventario está lleno. Los objetos siguen guardados."

market:
  empty: "<gray>Ningún pedido abierto coincide con tu filtro."
  search-prompt: "<gray>Escribe el nombre del objeto que buscas (por ejemplo <white>diamond</white>). <white>-</white> borra la búsqueda, <white><cancel></white> cancela."
  no-data: "<gray>No hay suficientes datos de mercado"
  recommendation: "<gray>Rango de precio recomendado para <item>: <white><low></white> a <white><high></white> (según <trades> operaciones en <days> días)."

favorites:
  header: "<gradient:#4ea8de:#7b6cf6>Tus favoritos</gradient>"
  empty: "<gray>Sin favoritos. Sostén un objeto y usa <white>/order favorites add</white>."
  line: "<gray><item> <dark_gray>|</dark_gray> alerta desde <white><alert></white>"
  alert-off: "<yellow>Alerta de precio de <item> eliminada."
  unchanged: "<gray>No cambió nada para <item>."
  not-a-favorite: "<red><item> todavía no es uno de tus favoritos. Añádelo primero."
  added: "<green><item> añadido a favoritos."
  removed: "<yellow><item> quitado de favoritos."
  alert-set: "<green>Alerta de precio fijada para <item> en <price>."

notify:
  live-summary: "<aqua>Hace un momento: llegaron <items> objetos en <deliveries> entregas, <expired> de tus pedidos caducaron."
  login-summary: "<aqua>Mientras estabas fuera: llegaron <items> objetos en <deliveries> entregas, <expired> de tus pedidos caducaron."
  price-alert: "<aqua>Alerta de precio: se buscan <quantity>x <item> a <unit> cada uno (pedido n.º <id>)."
  claims-waiting: "<aqua>Tienes <count> paquetes de objetos esperando. Usa <white>/order claims</white>."
  delivered: "<aqua>Pedido n.º <id>: <quantity>x <item> entregados."
  new-order: "<aqua>Nuevo pedido de <item>: <quantity>x a <unit> cada uno."
  summary: "<aqua>Tienes <count> notificaciones nuevas."

admin:
  transaction-not-found: "<yellow>No hay ninguna transacción con ese id."
  entry: "<gray><entry>"
  ledger-line: "<gray>  <kind> <white><amount></white> <player>"
  warning: "<red>[OrderHub] <message>"
  help: "<gray>reload | list [estado] | cancel <id> confirm <motivo> | purge-expired confirm <motivo> | transactions [uuid-jugador] | transaction <uuid> | inspect <id> | recovery confirm <motivo> | review list|show|resolve | health | dump | backup confirm <motivo> | export orders|ledger confirm <motivo> | statistics | debug"
  confirm-required: "<yellow>Repite el comando con <white>confirm</white> y un motivo para continuar."
  reason-required: "<red>Se necesita un motivo."
  cancelled: "<green>Pedido n.º <id> cancelado por un administrador. Motivo registrado."
  recovery-started: "<gray>Recuperación iniciada."
  recovery-report: "<gray>Recuperación terminada: <fixed> corregidos, <review> requieren revisión manual."
  purge-done: "<green>Se procesaron <count> pedidos caducados."
  header: "<gradient:#4ea8de:#7b6cf6>Administración de OrderHub</gradient>"
  statistics: "<gray>Activos <white><active></white>, en pausa <white><paused></white>, completados <white><completed></white>, cancelados <white><cancelled></white>, caducados <white><expired></white>, revisión manual <white><review></white>."
  debug: "<gray>Servidor <white><server></white>, base de datos <white><dialect></white>, menús abiertos <white><menus></white>."
  review-header: "<gradient:#4ea8de:#7b6cf6>Revisión manual</gradient> <gray>(<count>)"
  review-line: "<gray><white><id></white> <type> <amount> jugador <player> <detail>"
  review-usage: "<yellow>Uso: /orderadmin review resolve <tx> paid|refund|discard confirm <motivo>"
  review-result: "<gray>Revisión <white><tx></white> <how>: <white><status></white> (transacción de reembolso <refund>)"
  order-line: "<gray>n.º <id> <white><item></white> <filled>/<total> a <unit>, propietario <owner>, <status>"
  health-db: "<gray>Pool de base de datos: <white><active></white> activas, <white><idle></white> libres, <white><waiting></white> esperando, <white><total></white> en total. Ejecutor: <white><running></white> en curso, <white><queued></white> en cola."
  health-payments: "<gray>Pagos: <white><open></white> abiertos, <white><progress></white> en curso, <white><review></white> en revisión manual."
  dump-done: "<green>Archivo de soporte escrito: <file>. Revísalo antes de compartirlo, se eliminan secretos, UUID y direcciones IP."
  health-economy: "<gray>Economía: <white><samples></white> llamadas medidas, mediana <white><median></white> ms, máximo <white><max></white> ms, última <white><last></white> ms. Pago abierto más antiguo: <white><oldest></white> s."
  health-recovery: "<gray>Última recuperación <white><at></white>: <summary>"
  health-recovery-none: "<gray>Todavía no hubo ninguna recuperación desde el inicio."
  backup-done: "<green>Copia de seguridad escrita: <file>"
  backup-failed: "<red><reason>"
  export-usage: "<yellow>Uso: /orderadmin export orders|ledger confirm <motivo>"
  export-done: "<green>Se exportaron <rows> filas a <file>"
  recovery-summary: "<gray><summary>"
  transaction: "<gray>Transacción <white><id></white> <state> <amount> jugador <player>"

