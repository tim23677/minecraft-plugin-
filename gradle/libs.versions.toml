[versions]
paper = "1.21.11-R0.1-SNAPSHOT"
vault = "1.7.1"
hikari = "7.1.0"
sqlite = "3.54.1.0"
mariadb = "4.0.0"
slf4j = "2.0.17"
junit = "6.0.3"
mockbukkit = "4.116.3"
assertj = "3.27.7"
testcontainers = "2.0.5"
spotbugsAnnotations = "4.10.5"

# Plugins
spotless = "8.12.0"
spotbugsPlugin = "6.5.13"
dependencyCheck = "13.0.0"
shadow = "9.6.1"
pitestPlugin = "1.19.0"
pitest = "1.20.0"
pitestJunit5 = "1.2.3"

[libraries]
paper-api = { module = "io.papermc.paper:paper-api", version.ref = "paper" }
vault-api = { module = "com.github.MilkBowl:VaultAPI", version.ref = "vault" }
hikaricp = { module = "com.zaxxer:HikariCP", version.ref = "hikari" }
sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqlite" }
mariadb-jdbc = { module = "org.mariadb.jdbc:mariadb-java-client", version.ref = "mariadb" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
spotbugs-annotations = { module = "com.github.spotbugs:spotbugs-annotations", version.ref = "spotbugsAnnotations" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
mockbukkit = { module = "org.mockbukkit.mockbukkit:mockbukkit-v1.21", version.ref = "mockbukkit" }
assertj = { module = "org.assertj:assertj-core", version.ref = "assertj" }
testcontainers-bom = { module = "org.testcontainers:testcontainers-bom", version.ref = "testcontainers" }
testcontainers-junit = { module = "org.testcontainers:testcontainers-junit-jupiter" }
testcontainers-mariadb = { module = "org.testcontainers:testcontainers-mariadb" }

[plugins]
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
spotbugs = { id = "com.github.spotbugs", version.ref = "spotbugsPlugin" }
dependency-check = { id = "org.owasp.dependencycheck", version.ref = "dependencyCheck" }
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
pitest = { id = "info.solidsoft.pitest", version.ref = "pitestPlugin" }
